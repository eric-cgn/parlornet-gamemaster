# Every push to main: if rulebooks/installer/rulebooks.ini names an installer version with no release yet,
# build the rulebooks with tools/build.sh (Retro68 in Docker, pinned by digest) and the installer (EUP at a
# pinned commit), run the tests, tag the commit v<version> (v1.6 for Install ParlorNet Rulebooks 1.6) and
# publish a GitHub Release with three files, which are the installer as BinHex (.hqx), as MacBinary (.bin) and
# on an 800K disk image (.dsk). The release notes link each file and give its SHA-256. A push that keeps the
# version does nothing. The ParlorNet docs site fetches the three files from the release at a pinned tag and
# checks their SHA-256. Run it by hand on main to release a version whose push did not run it.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# One at a time, so two quick landings can't both release the same version
concurrency: release

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - id: version
        name: A new version?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(sed -n 's/^version = //p' rulebooks/installer/rulebooks.ini | head -n 1)
          echo "VERSION=$v" >> "$GITHUB_ENV"
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "Install ParlorNet Rulebooks $v is already released"
            echo "new=no" >> "$GITHUB_OUTPUT"
          else
            echo "new=yes" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        if: steps.version.outputs.new == 'yes'
        run: tools/build.sh
      - name: Test
        if: steps.version.outputs.new == 'yes'
        run: python3 -m unittest discover -s tests
      - name: Release
        if: steps.version.outputs.new == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION"
          f=parlornet-rulebooks-installer
          {
            echo "Install ParlorNet Rulebooks $VERSION puts the ParlorNet rulebook and the seven game rulebooks in the folder"
            echo "that holds GameMaster 1.0.0. The rulebooks run on a Mac Plus or later with System 6.0 or later, and the"
            echo "installer needs System 6.0.3 or later. Download one of these three files."
            echo
            echo "- [$f.hqx]($url/$f.hqx) is BinHex, for a Mac that decodes BinHex with StuffIt Expander or BinHex 4.0."
            echo "- [$f.bin]($url/$f.bin) is MacBinary, for a Mac or a download program that reads MacBinary."
            echo "- [$f.dsk]($url/$f.dsk) is an 800K disk image, for an emulator or for writing a floppy disk."
            echo
            echo "Their SHA-256 sums are below."
            echo
            echo '```'
            (cd build/release && sha256sum $f.hqx $f.bin $f.dsk)
            echo '```'
          } > "$notes"
          gh release create "v$VERSION" build/release/$f.hqx build/release/$f.bin build/release/$f.dsk \
            --target "$GITHUB_SHA" --title "Install ParlorNet Rulebooks $VERSION" --notes-file "$notes"
