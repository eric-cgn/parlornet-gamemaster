; Install ParlorNet Rulebooks: ParlorNet's rulebooks for GameMaster 1.0.0, made with EUP
; (https://github.com/eric-cgn/eup). tools/build.sh puts this file, About.txt and the rulebooks as built
; (ParlorNet.bin, Checkers.bin, ...) in one folder and runs:
;
;   eup build <that folder>/rulebooks.ini -o build
;
; The installer installs into the folder that holds GameMaster, and only there.

[installer]
product = ParlorNet Rulebooks
version = 1.6
file = Install ParlorNet Rulebooks
output = parlornet-rulebooks-installer
folder = GameMaster
get_info = Install ParlorNet Rulebooks 1.5, rulebooks for GameMaster 1.0.0. MIT license.
description_screen = About.txt

[type easy]
label = Easy Install
description = The ParlorNet rulebook and every game rulebook.

[type custom]
label = Custom Install
custom = yes

[group games]
label = Games
selectable = yes

[component parlornet]
label = ParlorNet
description = Signs you in to a parlor, starts games and takes invitations.
source = ParlorNet.bin
types = easy, custom

[component checkers]
group = games
label = Checkers
description = Checkers, American rules.
source = Checkers.bin
types = easy, custom

[component mancala]
group = games
label = Mancala
description = Mancala, Kalah rules with four seeds a pit.
source = Mancala.bin
types = easy, custom

[component fiveinarow]
group = games
label = Five in a Row
description = Five in a Row on a 15 by 15 board.
source = Five in a Row.bin
types = easy, custom

[component gridwords]
group = games
label = Grid Words
description = The crossword game on a parlor, with each table's board and letter values.
source = Grid Words.bin
types = easy, custom

[component rummytile]
group = games
label = Rummy Tile
description = Tile rummy for two, standard rules, on a parlor.
source = Rummy Tile.bin
types = easy, custom

[component cannonfire]
group = games
label = Cannon Fire
description = Two tanks shelling each other, on a parlor.
source = Cannon Fire.bin
types = easy, custom

[component backgammon]
group = games
label = Backgammon
description = Backgammon with the doubling cube, on a parlor.
source = Backgammon.bin
types = easy, custom

[upgrade]
detect = GameMaster
require = GameMaster
